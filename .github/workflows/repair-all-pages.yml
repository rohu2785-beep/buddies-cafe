name: Repair All Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair navigation and buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          nav = [
              ('Home', 'index.html'),
              ('About Us', 'about_page.html'),
              ('Menu', 'menu_page.html'),
              ('Combos', 'combos_page.html'),
              ('Review', 'reviews_page.html'),
              ('Contact', 'contact_page.html'),
          ]
          category_map = {
              'Chicken & Tenders': 'tenders.html',
              'Chicken and Tenders': 'tenders.html',
              'Pizzas': 'pizza.html',
              'Pizza': 'pizza.html',
              'Burgers & Mo-Burgers': 'Burger.html',
              'Burgers and Mo-Burgers': 'Burger.html',
              'Momos': 'momos.html',
              'Hotdogs': 'hotdog.html',
              'Hot Dogs': 'hotdog.html',
              'French Fries': 'french fries.html',
              'Snacks': 'snacks.html',
              'Waffles & Sundaes': 'dessert.html',
              'Waffles and Sundaes': 'dessert.html',
              'Shakes & Brews': 'Bevarages.html',
              'Shakes and Brews': 'Bevarages.html',
          }

          def set_anchor_href(s, label, target):
              pattern = re.compile(r'(<a\b[^>]*?)\bhref=("[^"]*"|\'[^\']*\')([^>]*>\s*' + re.escape(label) + r'\s*</a>)', re.I | re.S)
              return pattern.sub(lambda m: m.group(1) + 'href="' + target + '"' + m.group(3), s)

          for p in Path('.').glob('*.html'):
              if p.name == '404.html':
                  continue
              s = p.read_text(encoding='utf-8')
              original = s

              # Make sure every page loads the global click repair script.
              if 'src="site-fix.js"' not in s:
                  tag = '<script src="site-fix.js" defer></script>'
                  if '</head>' in s:
                      s = s.replace('</head>', tag + '\n</head>', 1)
                  else:
                      s = tag + '\n' + s

              for label, target in nav:
                  s = set_anchor_href(s, label, target)

              for label, target in category_map.items():
                  s = set_anchor_href(s, label, target)

              swiggy = 'https://www.swiggy.com/city/virudhunagar/buddies-fathimanagar-rest1086766'
              for label in ['Order Online', 'Order Now']:
                  s = set_anchor_href(s, label, swiggy)

              if s != original:
                  p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repaired pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' site-fix.js
          git diff --cached --quiet || git commit -m "Fix navigation and buttons across all pages"
          git push
