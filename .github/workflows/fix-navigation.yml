name: Fix cafe navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-navigation:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Apply the same six-item navigation to every HTML page
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          NAV = '''<nav class="hidden xl:flex items-center gap-lg" data-active-classes="text-primary-container font-bold">
          {HOME}
          {ABOUT}
          {MENU}
          {COMBOS}
          {REVIEW}
          {CONTACT}
          </nav>'''

          def link(label, path, active):
              if active:
                  return f'<a aria-current="page" class="transition-colors text-primary-container font-bold" data-path="{path}" href="{path}_page.html">{label}</a>' if path != 'home' else '<a aria-current="page" class="transition-colors text-primary-container font-bold" data-path="home" href="index.html">Home</a>'
              href = 'index.html' if path == 'home' else f'{path}_page.html'
              return f'<a class="font-body-md text-body-md text-on-surface-variant hover:text-on-surface transition-colors" data-path="{path}" href="{href}">{label}</a>'

          for file in Path('.').glob('*.html'):
              if file.name == '404.html':
                  continue

              text = file.read_text(encoding='utf-8')
              original = text
              name = file.name.lower()

              if name in ('index.html', 'home page.html'):
                  current = 'home'
              elif 'about' in name:
                  current = 'about'
              elif 'combo' in name:
                  current = 'combos'
              elif 'review' in name:
                  current = 'reviews'
              elif 'contact' in name:
                  current = 'contact'
              elif 'menu' in name or name in ('pizza.html','burger.html','momos.html','tenders.html','snacks.html','dessert.html','bevarages.html','french fries.html','hotdog.html'):
                  current = 'menu'
              else:
                  current = ''

              nav = NAV.format(
                  HOME=link('Home', 'home', current == 'home'),
                  ABOUT=link('About Us', 'about', current == 'about'),
                  MENU=link('Menu', 'menu', current == 'menu'),
                  COMBOS=link('Combos', 'combos', current == 'combos'),
                  REVIEW=link('Review', 'reviews', current == 'reviews'),
                  CONTACT=link('Contact', 'contact', current == 'contact'),
              )

              # Replace only the first navigation inside the fixed header.
              header_match = re.search(r'(<header\\b.*?</header>)', text, flags=re.I|re.S)
              if header_match:
                  header = header_match.group(1)
                  header_new, count = re.subn(r'<nav\\b[^>]*>.*?</nav>', nav, header, count=1, flags=re.I|re.S)
                  if count:
                      text = text[:header_match.start(1)] + header_new + text[header_match.end(1):]

              # Fix requested menu labels wherever they occur.
              replacements = {
                  'Artisanal Pizza': 'Pizza', 'artisanal pizza': 'pizza',
                  'Pan Fried Momos': 'Momos', 'pan fried momos': 'momos',
                  'Gourmet Hot Dogs': 'Hotdog', 'Gourmet Hot Dog': 'Hotdog',
                  'French Fries & Bowls': 'French Fries', 'french fries & bowls': 'french fries'
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)

              # Normalize common old navigation destinations outside the header too.
              for old, new in {
                  'home page.html':'index.html', 'menu page.html':'menu_page.html',
                  'combos page.html':'combos_page.html', 'about page.html':'about_page.html',
                  'reviews page.html':'reviews_page.html', 'contact us.html':'contact_page.html',
                  'contact page.html':'contact_page.html'
              }.items():
                  text = text.replace(old, new)

              if text != original:
                  file.write_text(text, encoding='utf-8')
          PY

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Fix navigation across all cafe pages [skip ci]'
            git push
          fi
