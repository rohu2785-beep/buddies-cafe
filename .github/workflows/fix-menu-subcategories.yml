name: Fix Menu Subcategory Links

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix menu subcategory links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('menu_page.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'href="#cat-chicken"': 'href="tenders.html"',
              'href="#cat-pizzas"': 'href="pizza.html"',
              'href="#cat-burgers"': 'href="Burger.html"',
              'href="#cat-momos"': 'href="momos.html"',
              'href="#cat-hotdogs"': 'href="hotdog.html"',
              'href="#cat-fries"': 'href="french fries.html"',
              'href="#cat-snacks"': 'href="snacks.html"',
              'href="#cat-desserts"': 'href="dessert.html"',
              'href="#cat-beverages"': 'href="Bevarages.html"',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu_page.html
          git diff --cached --quiet || git commit -m "Fix menu subcategory navigation"
          git push
